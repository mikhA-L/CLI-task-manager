[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-task-manager"
version = "0.1.0"
description = "A terminal-based task manager built with Rich and Python."
authors = [
    { name = "Mi Kha-el" }
]
dependencies = [
    "rich>=13.0.0"
]
requires-python = ">=3.10"

[project.scripts]
taskmanager = "tmain.taskmanager:main"